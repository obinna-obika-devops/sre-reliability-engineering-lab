apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reliability-api-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reliability-api-allow-dns
spec:
  podSelector:
    matchLabels: {app: reliability-api}
  policyTypes: [Egress]
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - {protocol: UDP, port: 53}
