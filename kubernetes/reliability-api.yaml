apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-api
spec:
  replicas: 3
  selector:
    matchLabels: {app: reliability-api}
  template:
    metadata:
      labels: {app: reliability-api}
    spec:
      containers:
      - name: api
        image: reliability-api:local
        ports: [{containerPort: 8000}]
        readinessProbe:
          httpGet: {path: /readyz, port: 8000}
          initialDelaySeconds: 3
        livenessProbe:
          httpGet: {path: /healthz, port: 8000}
          initialDelaySeconds: 5
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: 500m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: reliability-api
spec:
  selector: {app: reliability-api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reliability-api
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: reliability-api}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: reliability-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: reliability-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target: {type: Utilization, averageUtilization: 70}
